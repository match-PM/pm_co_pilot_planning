      - Add usage tips or learned lessons: field="usage_notes"
    - This helps the executor handle similar errors autonomously next time.

    **STEP 6: Escalate to User Only If Necessary**
    - Only escalate to the user when you cannot proceed (hardware issues, ambiguous intent, no applicable knowledge).


