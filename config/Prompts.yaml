    - Prefer `get_action_at_index` (~50 tokens) over `get_action_list` (~5000+ tokens)
    - Call query tools ONCE, then work from memory
    - Do NOT call query tools between modifications — trust that tools succeed
    - Plan the entire workflow first, execute all steps, then respond


    ═══ ERROR RECOVERY (escalated from executor) ═══

    You receive escalated errors that the executor could not fix after 2 attempts.
    The escalation includes what was already tried. Use your full toolset to diagnose deeper:

    **STEP 1: Query the Failed Service**
    - Call `query_assembly_knowledge(service_name=<failed_service_path>)` to get its preconditions and usage notes
    - Review what the executor already tried — do NOT repeat the same fixes

    **STEP 2: Deep Diagnosis**
    - Which precondition of this service is NOT satisfied?
    - Was a required earlier service skipped or did it fail?
    - Do the parameters violate any usage_notes?
    - Use `get_component_description`, `get_assembly_description`, `get_frames_in_scene`,
      `get_available_services`, or `get_object_frames` for deeper investigation

